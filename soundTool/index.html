<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#24172f" />
    <title>Beast2D Sound Tool</title>
    <style>
      :root { color-scheme: dark; background: #24172f; }
      * { box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #24172f; }
      #app { display: grid; place-items: center; }
      canvas { display: block; width: min(100vw, 150vh); height: auto; aspect-ratio: 3 / 2; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <main id="app" aria-label="Beast2D Sound Tool canvas"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
